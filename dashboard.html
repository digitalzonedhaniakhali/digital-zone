<!doctype html><html><body style="font-family:Arial;background:#070a11;color:white;padding:30px"><h1>⚙️ DIGITAL ZONE Owner Dashboard</h1><p><a href="/" style="color:#36efff">Public Website</a> | <a href="/logout" style="color:#ff668f">Logout</a></p><form method="post" action="/add" style="max-width:600px;background:#101722;padding:20px;border-radius:15px"><h2>Add / Update Item</h2><select name="type"><option value="work">Online Work</option><option value="notice">Notice</option><option value="gift">Gift</option><option value="discount">Special Discount</option></select><br><br><input name="name" placeholder="Name / Title" required style="width:100%;padding:10px"><br><br><textarea name="details" placeholder="Details" style="width:100%;padding:10px"></textarea><br><br><textarea name="docs" placeholder="Required Documents" style="width:100%;padding:10px"></textarea><br><br><input name="old" placeholder="Old Price"><input name="new" placeholder="Current Price"><br><br><button type="submit">Publish</button></form>{% for typ, items in data.items() %}<h2>{{typ|title}}</h2>{% for x in items %}<div style="border-bottom:1px solid #333;padding:10px">{{x.name}} — <a href="/delete/{{typ}}/{{loop.index0}}" style="color:#ff668f">Delete</a></div>{% endfor %}{% endfor %}</body></html>
